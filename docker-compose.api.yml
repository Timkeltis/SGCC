services:
  sgcc-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sgcc-api
    restart: unless-stopped
    ports:
      - "18080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
