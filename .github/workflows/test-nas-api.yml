name: Test NAS SGCC API

on:
  push:
    paths:
      - 'service.py'
      - 'sgcc_client/**'
      - 'tests/**'
      - 'requirements-api.txt'
      - '.github/workflows/test-nas-api.yml'
  pull_request:
    paths:
      - 'service.py'
      - 'sgcc_client/**'
      - 'tests/**'
      - 'requirements-api.txt'
      - '.github/workflows/test-nas-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NAS API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Run NAS API tests
        run: python -m unittest discover -s tests -v
